# This branch-only workflow must not replace the production workflow on main.
name: Test and publish isolated design preview
on:
  push:
    branches: [codex/training-board-preview]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  # Share main's deployment queue so the two versions cannot deploy concurrently.
  group: pages-refs/heads/main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - name: Preserve production and stage the separate preview
        run: node scripts/prepare-preview.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _preview-site
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/training-board-preview'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://jdbiggs60.github.io/electrical-wiring-simulator/preview/
    steps:
      - name: Ensure main still matches the production baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/JDBiggs60/electrical-wiring-simulator/commits/main --jq .sha)" = ef403a7747cd426126bbfbaf5e8675ab86a1c146
      - name: Publish combined artifact with production unchanged
        uses: actions/deploy-pages@v4
